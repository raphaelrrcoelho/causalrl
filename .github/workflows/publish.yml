name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
      - name: Build distributions
        run: uv build
      - name: Check distributions
        run: uvx twine check dist/*
      # Trusted publishing (OIDC) — no API token. Requires a publisher configured on
      # PyPI: https://docs.pypi.org/trusted-publishers/. For the FIRST release of a
      # project that does not yet exist on PyPI, add a *pending* publisher at
      # https://pypi.org/manage/account/publishing/ with:
      #   PyPI project name: causalrl
      #   Owner: raphaelrrcoelho   Repository: causalrl
      #   Workflow name: publish.yml   Environment: pypi
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
