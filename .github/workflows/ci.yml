name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Sync dependencies
        run: uv sync --extra dev --extra data
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run pyright src
      - name: Test
        run: uv run pytest -v --cov-fail-under=90

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
      - name: Sync documentation dependencies
        run: uv sync --extra docs
      - name: Build documentation
        run: uv run --extra docs mkdocs build --strict

  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
      - name: Sync dependencies
        run: uv sync --extra dev --extra examples
      - name: Execute example notebooks
        run: uv run pytest --nbmake --no-cov examples/
      - name: Smoke-test CGFA-PPO example
        run: uv run python examples/cgfa_ppo_example.py

  nuts:
    # Dedicated lane for the optional NUTS/NumPyro abduction backend (§7.1). Isolated on py3.11
    # (NumPyro/JAX have no py3.14 wheels) so it cannot destabilise the main matrix; --no-cov keeps
    # it clear of the 90% gate (the module is coverage-omitted there).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
      # Force py3.11 on every uv command: the [numpyro] extra is markered python < 3.14, so if uv
      # resolves against 3.14 the marker drops numpyro from the environment.
      - name: Sync dependencies (py3.11 + the numpyro extra)
        run: uv sync --python 3.11 --extra dev --extra numpyro
      - name: Verify NumPyro / JAX import (fail loudly, never silently skip)
        run: uv run --python 3.11 --no-sync python -c "import sys, numpyro, jax; print(sys.version.split()[0], 'numpyro', numpyro.__version__, 'jax', jax.__version__)"
      - name: NUTS abduction tests
        run: uv run --python 3.11 --no-sync pytest tests/test_scm_nuts.py -v --no-cov
