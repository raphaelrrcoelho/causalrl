[project]
name = "causalrl"
version = "2.0.0"
description = "Causal reinforcement learning: the 9-task causal RL taxonomy, made runnable."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Raphael Coelho", email = "raphaelrrcoelho@gmail.com" }]
keywords = [
    "causal-inference",
    "reinforcement-learning",
    "structural-causal-models",
    "causal-bandits",
    "transportability",
    "causal-discovery",
    "imitation-learning",
]
dependencies = [
    "networkx>=3.4",
    "gymnasium>=1.0",
    "numpy>=2.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Documentation = "https://raphaelrrcoelho.github.io/causalrl/"
Source = "https://github.com/raphaelrrcoelho/causalrl"
Issues = "https://github.com/raphaelrrcoelho/causalrl/issues"
Changelog = "https://github.com/raphaelrrcoelho/causalrl/blob/main/CHANGELOG.md"

[project.optional-dependencies]
torch = [
    "torch>=2.5",
]
examples = [
    "torch>=2.5",
    "stable-baselines3>=2.3",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    "torch>=2.5",
]
dev = [
    "torch>=2.5",
    "pytest>=8.4",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "ruff>=0.8",
    "pyright>=1.1.400",
    "pre-commit>=4.0",
    "jupyter>=1.1",
    "nbconvert>=7.16",
    "nbmake>=1.5",
]
interop = [
    "dowhy>=0.11",
    "econml>=0.15",
]
scale = [
    "d3rlpy>=2.6",
]
data = [
    "pyarrow>=15",
]
numpyro = [
    # NUTS abduction slow path (§7.1). NumPyro/JAX lack py3.14 wheels, so the marker keeps the
    # universal lock resolvable; the dedicated CI lane installs and exercises it on py3.11.
    "numpyro>=0.15; python_version < '3.14'",
]
jax = [
    # JAX scale backend (§9): vmapped SCM sampling + vectorised certificate kernels. JAX/jaxlib
    # ship no py3.14 wheels, so the marker keeps the universal lock resolvable; the dedicated CI
    # lane installs and exercises it on py3.11 (the numpy core is the always-tested default).
    "jax>=0.4; python_version < '3.14'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# econml (the [interop] extra) pins scikit-learn <1.7, which lacks py3.14 Windows wheels and would
# force the dev lock to build scikit-learn from source (CI failure). Override to a wheel-available
# version: the [interop] extra is never installed in CI, and pip ignores this override for end users
# (`pip install causalrl[interop]` still respects econml's real constraint).
override-dependencies = ["scikit-learn>=1.7,<1.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/causalrl"]

[tool.hatch.build.targets.sdist]
# The published package ships only the library. The local docs and experiment scripts
# and local dev caches are kept out of the source distribution.
exclude = [
  "docs/frontier",
  "docs/superpowers",
  "experiments",
  ".hypothesis",
  ".devcontainer",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["experiments"]  # local experiment scripts, not subject to library code quality gate

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
pythonVersion = "3.11"

[tool.coverage.run]
# Optional GPU/MCMC backends are verified on their own py3.11 CI lanes, not the main matrix (which
# installs neither numpyro nor jax), so exclude them from the 90% coverage gate.
omit = ["*/scm/continuous/nuts.py", "*/backends/jax/*"]

[tool.pytest.ini_options]
addopts = "-q --cov=causalrl --cov-report=term-missing"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "datasets>=4.8.5",
    "sentence-transformers>=5.5.1",
]
