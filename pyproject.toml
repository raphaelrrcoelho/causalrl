[project]
name = "causalrl"
version = "1.0.0"
description = "Causal reinforcement learning: the 9-task causal RL taxonomy, made runnable."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Raphael Coelho", email = "raphaelrrcoelho@gmail.com" }]
keywords = [
    "causal-inference",
    "reinforcement-learning",
    "structural-causal-models",
    "causal-bandits",
    "transportability",
    "causal-discovery",
    "imitation-learning",
]
dependencies = [
    "networkx>=3.4",
    "gymnasium>=1.0",
    "numpy>=2.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Documentation = "https://raphaelrrcoelho.github.io/causalrl/"
Source = "https://github.com/raphaelrrcoelho/causalrl"
Issues = "https://github.com/raphaelrrcoelho/causalrl/issues"
Changelog = "https://github.com/raphaelrrcoelho/causalrl/blob/main/CHANGELOG.md"

[project.optional-dependencies]
torch = [
    "torch>=2.5",
]
examples = [
    "torch>=2.5",
    "stable-baselines3>=2.3",
]
viz = [
    "torch>=2.5",
    "matplotlib>=3.9",
    "ipywidgets>=8.1",
    "plotly>=6.0",
    "scipy>=1.13",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    "torch>=2.5",
]
dev = [
    "torch>=2.5",
    "pytest>=8.4",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "ruff>=0.8",
    "pyright>=1.1.400",
    "pre-commit>=4.0",
    "jupyter>=1.1",
    "nbconvert>=7.16",
    "nbmake>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/causalrl"]

[tool.hatch.build.targets.sdist]
# The published package ships only the library. The local docs and experiment scripts
# and local dev caches are kept out of the source distribution.
exclude = [
  "docs/frontier",
  "docs/superpowers",
  "experiments",
  ".hypothesis",
  ".devcontainer",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["experiments"]  # local experiment scripts, not subject to library code quality gate

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
pythonVersion = "3.11"

[tool.pytest.ini_options]
addopts = "-q --cov=causalrl --cov-report=term-missing"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "datasets>=4.8.5",
    "sentence-transformers>=5.5.1",
]
