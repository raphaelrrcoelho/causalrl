[project]
name = "causalrl"
version = "0.1.0"
description = "Causal reinforcement learning: structural causal models meet RL."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "torch>=2.3",
    "networkx>=3.3",
    "gymnasium>=0.29",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "pyright>=1.1.370",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/causalrl"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
pythonVersion = "3.13"

[tool.pytest.ini_options]
addopts = "-q --cov=causalrl --cov-report=term-missing"
testpaths = ["tests"]
