name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Sync dependencies
        run: uv sync --extra dev --extra data
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run pyright src
      - name: Test
        run: uv run pytest -v --cov-fail-under=90

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
      - name: Sync documentation dependencies
        run: uv sync --extra docs
      - name: Build documentation
        run: uv run --extra docs mkdocs build --strict

  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
      - name: Sync dependencies
        run: uv sync --extra dev --extra examples
      - name: Execute example notebooks
        run: uv run pytest --nbmake --no-cov examples/
      - name: Smoke-test CGFA-PPO example
        run: uv run python examples/cgfa_ppo_example.py
      - name: Run the task guides (five that certify a policy, one that trains one)
        run: |
          for guide in examples/guides/*.py; do
            echo "== $guide =="
            uv run python "$guide"
          done
      - name: Smoke-test the columnar-simulator worked example
        run: uv run python examples/columnar_sim_example.py
      - name: Smoke-test the empirical-game worked example
        run: uv run python examples/empirical_game_pool.py

  nuts:
    # Dedicated lane for the optional NUTS/NumPyro abduction backend (§7.1). Isolated on py3.11
    # (NumPyro/JAX have no py3.14 wheels) so it cannot destabilise the main matrix; --no-cov keeps
    # it clear of the 90% gate (the module is coverage-omitted there).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
      # Force py3.11 on every uv command: the [numpyro] extra is markered python < 3.14, so if uv
      # resolves against 3.14 the marker drops numpyro from the environment.
      - name: Sync dependencies (py3.11 + the numpyro extra)
        run: uv sync --python 3.11 --extra dev --extra numpyro
      - name: Verify NumPyro / JAX import (fail loudly, never silently skip)
        run: uv run --python 3.11 --no-sync python -c "import sys, numpyro, jax; print(sys.version.split()[0], 'numpyro', numpyro.__version__, 'jax', jax.__version__)"
      - name: NUTS abduction tests
        run: uv run --python 3.11 --no-sync pytest tests/test_scm_nuts.py tests/test_bayesian_fit.py -v --no-cov

  jax:
    # Dedicated lane for the optional JAX scale backend (§9). Isolated on py3.11 (JAX/jaxlib have no
    # py3.14 wheels) so it cannot destabilise the main matrix; --no-cov keeps it clear of the 90%
    # gate (backends/jax is coverage-omitted there). The numpy streaming core is the always-tested
    # default; this lane only verifies JAX/numpy backend parity and PRNG determinism.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
      # Force py3.11 on every uv command: the [jax] extra is markered python < 3.14, so if uv
      # resolves against 3.14 the marker drops jax from the environment.
      - name: Sync dependencies (py3.11 + the jax extra)
        run: uv sync --python 3.11 --extra dev --extra jax
      - name: Verify JAX import (fail loudly, never silently skip)
        run: uv run --python 3.11 --no-sync python -c "import sys, jax; print(sys.version.split()[0], 'jax', jax.__version__)"
      - name: JAX backend parity + determinism tests
        run: uv run --python 3.11 --no-sync pytest tests/test_backends_jax.py -v --no-cov

  scale:
    # Fresh-install smoke for the [scale] extra (d3rlpy) on py3.11 (§10 acceptance: +scale green).
    # The RL stack has no py3.14 wheels; the adapter is duck-typed and also tested (mocked) on the
    # main matrix, so this lane proves the fresh install resolves and imports.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
      - name: Sync dependencies (py3.11 + the scale extra)
        run: uv sync --python 3.11 --extra dev --extra scale
      - name: Verify d3rlpy install + adapter import
        run: uv run --python 3.11 --no-sync python -c "import d3rlpy, causalrl.scale.d3rlpy; print('d3rlpy', d3rlpy.__version__)"
      - name: Scale adapter tests (with the real d3rlpy present)
        run: uv run --python 3.11 --no-sync pytest tests/test_scale_bridge.py tests/test_scale_certify_policy.py tests/test_scale_d3rlpy_deep.py tests/test_scale_example_smoke.py --no-cov

  interop:
    # Fresh-install smoke for the [interop] extra (DoWhy/EconML) on py3.11 (§10: +interop green).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
      - name: Sync dependencies (py3.11 + the interop extra)
        run: uv sync --python 3.11 --extra dev --extra interop
      - name: Verify DoWhy/EconML install + adapter imports
        run: uv run --python 3.11 --no-sync python -c "import dowhy, econml, causalrl.interop.sbi_numpyro, causalrl.interop.columnar_sim; print('interop OK')"
      - name: Interop adapter tests (with the real DoWhy/EconML present)
        # The econml worked-example hits an UPSTREAM econml x scikit-learn incompatibility
        # (LogisticRegressionCV.multi_class was removed in scikit-learn >= 1.7), unrelated to
        # causalrl; deselect just that one example. Our adapters and the DoWhy example still run
        # against the real libraries.
        run: >-
          uv run --python 3.11 --no-sync pytest
          tests/test_interop_dowhy.py tests/test_interop_econml.py
          tests/test_interop_sbi_numpyro.py tests/test_interop_columnar_sim.py
          tests/test_interop_example_smoke.py
          --deselect "tests/test_interop_example_smoke.py::test_interop_example_runs[interop_econml_certify.py]"
          --no-cov

  generality:
    # Generality lint (§12.4 / invariant I7): no application-domain noun may leak into the public
    # surface of src/causalrl (identifiers or docstrings). Pure stdlib, so it runs in an isolated
    # interpreter with no project sync. Also enforced inside the main matrix by
    # tests/test_generality_lint.py; this lane is the explicit, standalone §12.4 CI scan.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
      - name: Generality lint (domain-noun scan of the public core)
        run: uv run --no-project --python 3.11 python tools/generality_lint.py
