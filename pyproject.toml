[project]
name = "causalrl"
version = "0.3.0"
description = "Causal reinforcement learning: structural causal models meet RL."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "torch>=2.5",
    "networkx>=3.4",
    "gymnasium>=1.0",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "ruff>=0.8",
    "pyright>=1.1.400",
    "pre-commit>=4.0",
    "jupyter>=1.1",
    "nbconvert>=7.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/causalrl"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
pythonVersion = "3.14"

[tool.pytest.ini_options]
addopts = "-q --cov=causalrl --cov-report=term-missing"
testpaths = ["tests"]
